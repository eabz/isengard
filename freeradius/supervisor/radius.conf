[unix_http_server]
file=/run/freeradius-supervisor/control.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
umask=0077
pidfile=/run/freeradius-supervisor/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/freeradius-supervisor/control.sock

[program:stunnel]
command=/usr/bin/stunnel4 /etc/stunnel/google-ldap.conf
priority=10
autostart=true
autorestart=true
; Retry even if startup fails immediately. Readiness is checked separately.
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freeradius]
command=/usr/bin/python3 /usr/local/bin/radius-service.py start
priority=20
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
