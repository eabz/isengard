# RADIUS clients (who may send auth requests).
#
# The shared secret must match what you configure on each access point / WLC.

# Wireless access points / LAN. Secret comes from RADIUS_CLIENT_SECRET in .env
# and must match what you configure on the APs.
client local_lan {
	ipaddr = 10.0.0.0/19
	secret = "$ENV{RADIUS_CLIENT_SECRET}"
	shortname = local-lan
	nas_type = other
}

# Loopback — used by scripts/radius-test-auth.sh (docker exec -> 127.0.0.1).
# Test-only secret from RADIUS_TEST_SECRET in .env (defaults to "testing123"
# if unset — see docker-entrypoint.sh). Never used by real APs.
client localhost {
	ipaddr = 127.0.0.1
	secret = "$ENV{RADIUS_TEST_SECRET}"
	shortname = localhost
	nas_type = other
}

# Docker bridge — tests sent from the host hit a published port and arrive
# from the container's bridge network, not 127.0.0.1. Pinned to the
# radius_test bridge subnet defined in docker-compose.yml (was the entire
# 172.16.0.0/12 RFC1918 block, which is far wider than this host's actual
# Docker bridge and would accept spoofed accounting from any container on the
# box). Same test-only secret as above.
client docker_bridge {
	ipaddr = 172.30.238.0/24
	secret = "$ENV{RADIUS_TEST_SECRET}"
	shortname = docker-bridge
	nas_type = other
}
